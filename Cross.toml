# Config do `cross` usada pelo job "Build Linux ARM64" do release.yml.
#
# Desde a v0.3.3 o OpenSSL é VENDORED (feature `native-tls/vendored` via
# garraia-channels, ver Cargo.toml raiz): o openssl-src compila um OpenSSL
# estático com o toolchain do target, então o pre-build que instalava
# `libssl-dev:$CROSS_DEB_ARCH` (workaround do build aarch64 do v0.3.0) foi
# removido — é exatamente a solução recomendada pelo FAQ do cross para
# OpenSSL em cross-compile. Bônus: o binário não linka libssl.so do sistema
# em NENHUMA plataforma (a receita antiga está no git log deste arquivo).
#
# Seguimos instalando o cross da git, não o 0.2.5 de crates.io (base 16.04) —
# ver comentário no release.yml.
[target.aarch64-unknown-linux-gnu]
