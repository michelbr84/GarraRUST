[package]
name = "garraia-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration loading and management for GarraIA"

[dependencies]
garraia-common = { workspace = true }
# Needed by `provider_keys` so the vault tier of the API-key precedence chain
# can be evaluated here rather than duplicated per consumer. No cycle:
# garraia-security depends only on garraia-common.
garraia-security = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
tokio = { workspace = true }
dirs = "6"
# GAR-391c — AuthConfig::from_env validation + redacted secret wrapping.
secrecy = { version = "0.10", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
# #1127 — `valida_home_assistant` no check: mesmo parser de URL que o guard
# de SSRF vai usar no boot, para o `config check` não concordar com ele.
url = { workspace = true }
