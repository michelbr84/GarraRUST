[package]
name = "garraia-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop Control Center — logica sem Tauri: modulos, estado ligado/desligado, deteccao de agentes e supervisao de processo. ADR 0021."

[dependencies]
# Deliberadamente minimo. Esta crate existe porque `garraia-desktop` (Tauri)
# esta fora de todos os gates de CI; arrastar para ca qualquer dependencia
# pesada — em especial `tauri` — anularia o motivo dela existir.
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Job Object do processo supervisionado (`jobobject` + `supervise`):
# KILL_ON_JOB_CLOSE mata a arvore do sidecar quando o desktop morre de forma
# abrupta, onde nenhum `Drop` roda — o Windows nao tem PDEATHSIG. So no
# Windows, sem feature gate (contencao atras de gate e contencao que alguem
# esquece de ligar); a versao 0.61 ja esta no Cargo.lock, sem crate nova.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
