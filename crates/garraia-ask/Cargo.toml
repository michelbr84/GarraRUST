[package]
name = "garraia-ask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GarraIA — núcleo one-shot de `garra_ask` (CLI, servidor stdio e ponte MCP HTTP)"

# #1612: o núcleo do `garra ask` mora aqui para o gateway conseguir usá-lo sem
# depender de `garraia` (a CLI). Dependências mínimas de propósito: agentes
# (o `AgentRuntime` e os providers), config (o `AppConfig`) e as utilidades de
# texto e id. Nada de canal, banco ou HTTP servidor.
[dependencies]
garraia-agents = { workspace = true }
garraia-config = { workspace = true }
# #1790: o `ProviderObservado` do `ask` implementa `LlmProvider` (trait
# `#[async_trait]`, erro `garraia_common::Error`, stream do `futures`). As
# tres ja vem pelo `garraia-agents` — nenhuma crate nova na arvore.
garraia-common = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# #1778: `build_provider` recebe o cliente HTTP montado a partir de
# `timeouts` e o entrega por `with_client`. Nenhuma arvore nova — o
# `garraia-agents` logo acima ja compila o `reqwest`, com as mesmas features.
reqwest = { workspace = true }
# Só para `test-support` (endpoint HTTP falso); fora dele, não entra no binário.
wiremock = { version = "0.6", optional = true }

[features]
# Mesma feature do `garraia-agents`: o `EchoProvider` keyless so existe em
# build de desenvolvimento/CI. Propagada pela CLI e pelo gateway.
dev-echo-provider = ["garraia-agents/dev-echo-provider"]
# Expõe `provider_binding::mock_endpoint` (endpoint HTTP falso) para os testes
# de roteamento da CLI e do gateway. Ativada só em `[dev-dependencies]`.
test-support = ["dep:wiremock"]

[dev-dependencies]
wiremock = "0.6"
