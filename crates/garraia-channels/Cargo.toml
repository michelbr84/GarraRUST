[package]
name = "garraia-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Messaging channel traits and implementations for GarraIA"

[dependencies]
garraia-common = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }

serenity = { workspace = true, optional = true }
poise = { workspace = true, optional = true }
# Só para ligar `vendored` no native-tls que o serenity traz (OpenSSL
# estático — o binário de release não linka libssl.so do sistema). Ver
# comentário do serenity no Cargo.toml raiz.
native-tls = { workspace = true, optional = true }
teloxide = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
# Montagem de URL do Bot Framework: `Url::join` percent-encoda o segmento,
# entao um `conversation_id` vindo do corpo nao sobe no caminho.
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
dirs = { version = "7", optional = true }

# Assinatura do webhook do LINE (#1051): HMAC-SHA256 + Base64, comparacao
# em tempo constante. Mesma pilha RustCrypto ja usada em garraia-auth
# (jwt.rs) e garraia-storage (integrity.rs) — nenhum requisito de FIPS
# justifica trazer uma segunda implementacao de HMAC para a arvore.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
base64 = { workspace = true, optional = true }

# --- whatsapp-linked (#1239) -------------------------------------------------
# AES-256-GCM + PBKDF2-HMAC-SHA256 do blob de sessao e SHA-256 do hash dos
# assets do bridge. `ring` e exatamente a pilha que o `CredentialVault` de
# `garraia-security` ja usa (credentials.rs) — trazer um segundo AEAD para a
# arvore so para este caminho seria superficie criptografica nova sem motivo.
ring = { workspace = true, optional = true }
# Chave aleatoria de 32 B quando nao ha passphrase do cofre.
rand = { workspace = true, optional = true }
# Apaga o texto claro da sessao da memoria assim que ele sai de escopo. Ja
# estava no Cargo.lock como dependencia transitiva (1.8.2), entao promove-la a
# direta nao acrescenta nenhuma crate nova a arvore.
zeroize = { version = "1.8", features = ["zeroize_derive"], optional = true }
# Renderizador de QR no terminal. MIT OR Apache-2.0 (ambas ja na allowlist do
# deny.toml). `default-features = false` derruba `image` e `svg`: so
# precisamos da matriz de modulos, o desenho e nosso (qr.rs).
qrcode = { version = "0.14", default-features = false, optional = true }

[features]
default = []
# Interna, nunca ligada sozinha: a verificacao de JWT de entrada que o
# Google Chat e o Teams compartilham (`jwks.rs`). Os dois provedores
# autenticam o webhook com um JWT RS256 assinado por eles, e nao com um
# segredo compartilhado como o LINE — entao precisam de `jsonwebtoken` e
# de um cache das chaves publicas.
webhook-jwt = ["dep:jsonwebtoken", "dep:axum"]
discord = ["dep:serenity", "dep:poise", "dep:native-tls"]
google_chat = ["webhook-jwt"]
irc = []
# `dep:axum` entra aqui pelo mesmo motivo do `whatsapp`: o LINE e um canal
# push, e o handler do webhook (`line_channel::webhook`) e um handler Axum.
line = ["dep:hmac", "dep:sha2", "dep:subtle", "dep:base64", "dep:axum"]
matrix = []
openclaw = ["dep:tokio-tungstenite", "dep:futures"]
signal = []
slack = ["dep:tokio-tungstenite", "dep:futures"]
# `garraia-common/ssrf` porque o `serviceUrl` — o host para onde a resposta
# vai, com o bearer do bot junto — vem do corpo da atividade. E exatamente o
# caso da regra 14 do CLAUDE.md.
teams = ["webhook-jwt", "garraia-common/ssrf", "dep:url"]
telegram = ["dep:teloxide"]
voice = []
# `hmac`/`sha2`/`subtle` entram pela verificacao de `X-Hub-Signature-256`
# (#1070), o mesmo trio do `line`. O hex e decodificado a mao em
# `whatsapp/signature.rs` para nao acrescentar o crate `hex`.
whatsapp = ["dep:axum", "dep:hmac", "dep:sha2", "dep:subtle"]
imessage = ["dep:rusqlite", "dep:dirs"]
# WhatsApp por dispositivo vinculado (#1239, ADR 0023). Canal PULL, sem webhook
# e sem axum: o Rust supervisiona um bridge Node/Baileys por NDJSON em stdio.
# Disjunto da feature `whatsapp`, que e a Cloud API da Meta — as duas podem
# estar ligadas ao mesmo tempo e nao compartilham codigo.
whatsapp-linked = [
    "dep:ring",
    "dep:rand",
    "dep:zeroize",
    "dep:qrcode",
    "dep:base64",
    "tokio/process",
    "tokio/io-util",
    "tokio/time",
    "tokio/macros",
]

# PDEATHSIG do filho `node` (`whatsapp_linked::bridge`). **So PDEATHSIG**: ao
# contrario do MCP, o RLIMIT_AS NAO e aplicado aqui, e o porque esta no topo do
# `whatsapp_linked/bridge.rs` (a "cage" virtual do V8 mata o Node antes de ele
# fazer qualquer coisa). Mesma pilha do
# `garraia-agents::mcp::manager`; sem feature gate porque um
# `[target.'cfg(unix)'.dependencies]` opcional so seria ligavel por um feature
# que tambem existe fora de Unix — e contencao atras de gate e contencao que
# alguem esquece de ligar.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot` para exercitar os handlers de webhook como rota de
# verdade (status + corpo), sem subir servidor.
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `jwks::jwt_de_teste` monta o cabecalho dos JWTs de teste a partir do JSON
# em vez de fixar o base64 pronto no fonte. `base64` ja e dependencia
# opcional (feature `line`); aqui e dev-dependency porque o helper e
# `#[cfg(test)]` e vale para `google_chat` e `teams`, que nao ligam `line`.
base64 = { workspace = true }
tempfile = "3"
