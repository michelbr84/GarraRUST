[package]
name = "garraia-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, errors, and utilities for GarraIA"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
# Facade de metricas (src/metrics.rs, #957). Deliberadamente o facade e NAO o
# `garraia-telemetry`: quem emite as metricas da memoria e o `garraia-agents`,
# que o `garraia-cli` linka — depender da telemetria arrastaria OpenTelemetry,
# OTLP, tonic, axum e tower para dentro do binario da CLI, que nao usa nada
# disso. O facade e o padrao do ecossistema: biblioteca emite, binario instala
# o recorder. Sem recorder (o caso da CLI) cada macro e um no-op.
#
# Nao e opcional, ao contrario do `reqwest` acima: o facade sao dois ponteiros
# atomicos e nenhuma dependencia de peso, entao um feature gate custaria mais
# em complexidade do que economiza em arvore.
metrics = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
# SSRF guard (src/ssrf.rs): the vetted-address pinning and the capped body
# reader need an HTTP client. garraia-common is the one crate that
# garraia-gateway, garraia-agents and garraia-skills all depend on, so the guard
# lives here instead of being copied three times.
#
# Optional and OFF by default: this crate is otherwise just types and errors,
# and garraia-db / garraia-config / garraia-security depend on it without ever
# making an HTTP request. They must not inherit reqwest's dependency graph.
reqwest = { workspace = true, features = ["stream"], optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
# Enables `garraia_common::ssrf`. Turned on by the three crates that make
# outbound HTTP requests with remotely-influenced URLs.
ssrf = ["dep:reqwest", "dep:futures"]

[dev-dependencies]
# Self dev-dependency so `cargo test -p garraia-common` exercises tests/ssrf.rs
# instead of silently compiling it away.
garraia-common = { path = ".", features = ["ssrf"] }
tempfile = "3"
