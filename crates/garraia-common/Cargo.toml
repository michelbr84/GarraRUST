[package]
name = "garraia-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, errors, and utilities for GarraIA"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
# SSRF guard (src/ssrf.rs): the vetted-address pinning and the capped
# body reader need an HTTP client. garraia-common is the one crate that
# garraia-gateway, garraia-agents and garraia-skills all depend on, so the
# guard lives here instead of being copied three times.
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }

[dev-dependencies]
tempfile = "3"
