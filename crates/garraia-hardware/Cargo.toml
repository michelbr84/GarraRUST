[package]
name = "garraia-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware — trait Device, Capability com risco R0-R5, registry e gate. ADR 0020."

[features]
# MockDevice in-memory para testes e fixtures, mesmo padrão do
# `testing-provider` do garraia-embeddings: default-on porque os testes do
# crate dependem dele e o CI roda `cargo test --workspace` sem
# `--all-features`. Builds de produção que usarem `default-features = false`
# continuam com toda a superfície do trait — só perdem o mock.
mock-device = []
# Adapter MQTT (#1126, rumqttc): OFF por default — quem não usa transporte
# de rede não paga a árvore de deps. Mesmo padrão do `storage-s3`.
mqtt = ["dep:rumqttc"]
# Adapter Home Assistant (#1127, REST + WebSocket): OFF por default, mesmo
# padrão. `garraia-common/ssrf` traz o guard de URL (a chamada REST vai por
# cliente pinado — o token do HA é credencial de admin do hub).
home-assistant = ["dep:reqwest", "dep:tokio-tungstenite", "dep:futures", "dep:url", "dep:garraia-common"]
# Motor de automações (#1128): specs TOML/JSON + avaliador de expressões +
# engine sobre o barramento de eventos. OFF por default — quem não usa
# automação não paga croner/chrono/toml.
automations = ["dep:croner", "dep:chrono", "dep:toml"]
default = ["mock-device"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
# `tokio::sync::Mutex` no DeviceStateStore (padrão SessionStore); os testes
# usam o mesmo rt para `#[tokio::test]`.
tokio = { workspace = true }
# Feature `mqtt` (#1126): cliente MQTT async puro (sem runtime C). O event
# loop do rumqttc roda como task tokio própria do manager.
#
# `default-features = false` a propósito: o default (`use-rustls`) arrasta
# `rustls-webpki 0.102.8` + `rustls-pemfile` — exatamente a cadeia que o
# GAR-455 / health/20260517 eliminou do lock por advisory (RUSTSEC-2026-0049,
# -0098, -0099, -0104 e RUSTSEC-2025-0134). O adapter fala TCP puro com o
# broker local/LAN (`Transport::Tcp` é o default), então a superfície TLS do
# rumqttc é código morto aqui; e rumqttd (dev-dep) aceita `tls: None`.
# TLS MQTT voltar como slice próprio, com avaliação de supply-chain própria.
rumqttc = { version = "0.25", optional = true, default-features = false }
# Feature `home-assistant` (#1127): REST (reqwest, por `pinned_client` do
# ssrf) + WebSocket (tokio-tungstenite, para eventos `state_changed` —
# presença hoje, motor de automações da #1128 depois). `garraia-common`
# entra só pelo `ssrf` (vet_url + pinned_client).
garraia-common = { workspace = true, features = ["ssrf"], optional = true }
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# A URL base vetada (`VettedUrl.url` do ssrf) é `url::Url` — manter o tipo
# em vez de remontar paths na mão (`Url::join` evita `//api/states`).
url = { workspace = true, optional = true }
# Feature `automations` (#1128): croner para os gatilhos cron (mesmo parser
# do `garraia-db`/recorrência), chrono para o fuso local do host e toml para
# as specs declarativas versionáveis do usuário.
croner = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
# Broker MQTT embutido para os testes de integração da feature `mqtt`
# (#1126): mesmo time do rumqttc, roda in-process (sem docker).
rumqttd = { version = "0.20", default-features = false }
# Mock do Home Assistant para os testes de integração da feature
# `home-assistant` (#1127): axum serve os handlers REST e o WebSocket —
# sem docker, na linha do rumqttd acima.
axum = { workspace = true }