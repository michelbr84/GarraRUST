[package]
name = "garraia-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM agent runtime and orchestration for GarraIA"

[dependencies]
garraia-common = { workspace = true, features = ["ssrf"] }
# #937: o resumo de ferramenta passa por `redact_secrets` na origem, para
# nenhum consumidor de `TurnEvent` precisar lembrar de redigir.
garraia-security = { workspace = true }
garraia-db = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }

rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-io"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = []
mcp = ["dep:rmcp"]
mcp-http = ["mcp", "rmcp?/transport-streamable-http-client-reqwest"]
# Plan 0051 (GAR-444): deterministic echo LLM provider for dev + CI smoke
# tests. OFF by default — a release build without this feature never links
# `EchoProvider` and `crate::echo` is absent from the compiled artifact.
dev-echo-provider = []

[dev-dependencies]
# #957: so para os testes de metrica. O `DebuggingRecorder` + `with_local_recorder`
# instalam um recorder **thread-local**, o que permite afirmar que o runtime
# emitiu de fato — sem tocar no recorder global, que so pode ser instalado uma
# vez por processo e quebraria testes em paralelo.
metrics-util = { version = "0.20", features = ["debugging"] }
# O facade, para o teste poder instalar o recorder local. Em codigo de
# producao este crate emite via `garraia_common::metrics`, nao direto.
metrics = { workspace = true }
tempfile = "3"
axum = { workspace = true }
tokio-stream = { workspace = true }
