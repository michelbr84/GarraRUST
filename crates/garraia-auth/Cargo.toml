[package]
name = "garraia-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Authentication and authorization for GarraIA Group Workspace (GAR-391a/b)"
build = "build.rs"

[features]
# Exposes test-only escape hatches (`LoginPool::raw`, `SignupPool::raw`) so
# integration tests in `tests/` can build a raw `sqlx::PgPool` handle for the
# RLS matrix suite (GAR-392, plan 0013 path C). Production code (any non-test
# build) never enables this; CI audit checks that `pub fn raw` appears only
# under `#[cfg(any(test, feature = "test-support"))]`. See
# docs/superpowers/specs/2026-04-14-gar-391d-392-authz-suite-design.md §4.6.
test-support = []

[dependencies]
# SQL driver — runtime-only, matches garraia-workspace's feature set so the
# LoginPool can be built from the same Postgres instance without forcing TLS.
# `ipnetwork` feature is needed for binding `IpAddr` -> Postgres `inet`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork"] }
# Identifiers
uuid = { version = "1", features = ["v7", "serde"] }
# Timestamps
chrono = { version = "0.4", features = ["serde"] }
# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Errors
thiserror = { workspace = true }
# Async runtime
tokio = { workspace = true }
# Tracing (PII-safe spans via skip)
tracing = { workspace = true }
# Async traits — standard Rust ecosystem dep until trait return-position
# `impl Trait` lands stable for dyn-compatible traits.
async-trait = { workspace = true }
# Config validation — same crate version as garraia-workspace.
validator = { version = "0.21", features = ["derive"] }
# Password hashing — Argon2id (RFC 9106 first recommendation: m=64MiB, t=3, p=4)
# via RustCrypto. Isolated from garraia-security (which uses ring/PBKDF2) per
# plan 0011 §13 Q5 default.
argon2 = "0.6"
# Legacy PBKDF2 verify for the dual-verify lazy upgrade path. PBKDF2-SHA256
# stored as PHC strings produced by garraia-security and the GAR-413 migration
# tool. Feature `phc` (renamed from `simple` in 0.13) enables the PHC-string
# verify path + the `Pbkdf2::default()` SHA-256 hasher.
pbkdf2 = { version = "0.13", features = ["phc", "getrandom"] }
# Shared PHC string parser — required by both argon2 and pbkdf2. Since 0.6 the
# parsing lives in the `phc` crate (feature `phc`); `getrandom` powers the
# internal salt generation of `hash_password`.
password-hash = { version = "0.6.1", features = ["phc", "getrandom"] }
# Constant-time refresh-token comparison.
subtle = "2.6"
# HMAC-SHA256 for refresh-token hash + sha2 for the digest primitive.
hmac = "0.12"
sha2 = "0.10"
# Wraps secrets so they never reach `Debug`/`Display` accidentally.
secrecy = { version = "0.10", features = ["serde"] }
# JWT issuance + verification (HS256). Pinned via the workspace.
jsonwebtoken = { workspace = true }
# Cryptographic randomness for refresh tokens. We call `getrandom::fill`
# directly to decouple this crate from the rand 0.9 -> 0.10 transitive
# churn that broke Dependabot PR #103. See plan
# personal-api-key-revogada-vectorized-matsumoto §Decisões §3.
getrandom = "0.4"
# Base64 URL-safe encoding for refresh tokens.
base64 = { workspace = true }
# Axum extractor support (GAR-391c).
axum = { workspace = true }

[build-dependencies]
# Build script generates a DUMMY_HASH constant (Argon2id PHC over a discarded
# random secret) at compile time so the constant-time anti-enumeration path
# does not have to pay the hashing cost on every cold start. See plan 0011 §6.1.
#
# The dummy secret comes from `getrandom::fill` and the salt is generated
# internally by `hash_password` (password-hash 0.6 uses getrandom directly),
# so the old `rand = "0.8"` / rand_core 0.6 pin is gone. `PasswordHasher` is
# imported through the argon2 re-export — no direct password-hash build-dep.
argon2 = "0.6"
getrandom = "0.4"

[dev-dependencies]
# Compile-time `LoginPool: !Clone` denial — see GAR-391a security review H-1.
# Tiny zero-dep crate used only by unit tests.
static_assertions = "1"
# Serializa os testes de password_change.rs: cada teste segura uma conexão do
# LoginPool (max 5) através de hashing lento (Argon2id/PBKDF2 em debug) dentro
# de tx — 6 testes concorrentes estouram o acquire timeout do pool (plan 0354).
serial_test = { workspace = true }
# Integration tests spin their own pgvector container so garraia-auth stays
# independently testable. Shared fixture optimization deferred to GAR-391c.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
anyhow = "1"
# Used by the smoke test to apply migrations 001..008 before exercising the
# LoginPool constructor.
garraia-workspace = { path = "../garraia-workspace" }

# Gate all testcontainer-dependent integration tests behind the `test-support`
# feature so plain `cargo test -p garraia-auth` (and the workspace CI sweep)
# do not trigger Docker Hub image pulls. These tests are still exercised in
# the gateway coverage job via the transitive `test-helpers` -> `test-support`
# chain when the dedicated Docker-enabled Postgres service is provisioned.
[[test]]
name = "skeleton"
path = "tests/skeleton.rs"
required-features = ["test-support"]

[[test]]
name = "verify_internal"
path = "tests/verify_internal.rs"
required-features = ["test-support"]

[[test]]
name = "concurrent_upgrade"
path = "tests/concurrent_upgrade.rs"
required-features = ["test-support"]

[[test]]
name = "debug_redaction_pools"
path = "tests/debug_redaction_pools.rs"
required-features = ["test-support"]

[[test]]
name = "sessions_lifecycle"
path = "tests/sessions_lifecycle.rs"
required-features = ["test-support"]

[[test]]
name = "signup_flow"
path = "tests/signup_flow.rs"
required-features = ["test-support"]

[[test]]
name = "app_pool_role_guard"
path = "tests/app_pool_role_guard.rs"
required-features = ["test-support"]

[[test]]
name = "extractor"
path = "tests/extractor.rs"
required-features = ["test-support"]

# plan 0347 / GAR-891 (Q6.15) — kills 4 missed mutants from 2026-06-15 run
[[test]]
name = "password_change"
path = "tests/password_change.rs"
required-features = ["test-support"]

[[test]]
name = "audit_workspace_event_integration"
path = "tests/audit_workspace_event_integration.rs"
required-features = ["test-support"]
