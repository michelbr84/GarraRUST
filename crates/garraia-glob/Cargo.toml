[package]
name = "garraia-glob"
version = "0.1.0"
edition = "2021"
description = "Glob matching engine for GarraRUST"
license = "MIT OR Apache-2.0"
# Literal, nao `.workspace = true`: esta crate ainda nao herda do
# [workspace.package] (version 0.1.0 e edition 2021 proprios). Migrar a
# heranca inteira mudaria version e edition junto, o que nao e desta fatia.
rust-version = "1.95"

[dependencies]
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
regex = "1.10"
notify = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "matching"
harness = false

[features]
default = []
serde = []
# GAR-259: file watcher with glob filtering
watcher = ["dep:notify"]
