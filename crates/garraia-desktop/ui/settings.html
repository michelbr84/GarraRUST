<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Garra Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #1a1a24;
      color: #ddd;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100%;
    }
    .container {
      padding: 24px;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      color: #8af;
      margin-bottom: 24px;
    }
    .section {
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .section h2 {
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .row + .row {
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .row label {
      font-size: 14px;
    }
    .row .hint {
      font-size: 11px;
      color: #777;
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 24px;
      transition: background 0.2s;
    }
    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider {
      background: #4a9;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(20px);
    }
    .btn {
      padding: 8px 18px;
      background: rgba(136, 170, 255, 0.15);
      color: #8af;
      border: 1px solid rgba(136, 170, 255, 0.3);
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: rgba(136, 170, 255, 0.25);
    }
    .version {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Garra Settings</h1>

    <!-- "Start with OS" vive no menu da bandeja (tray.rs), que é quem fala com o
         plugin de autostart. Os toggles que existiam aqui nunca tiveram listener. -->
    <div class="section">
      <h2>Shortcuts</h2>
      <div class="row">
        <label>Toggle overlay</label>
        <span style="color:#8af;font-size:13px">Alt + G</span>
      </div>
      <div class="row">
        <label>Chat Bar</label>
        <span style="color:#8af;font-size:13px">Ctrl + Space</span>
      </div>
    </div>

    <!-- #1636: modo do WhatsApp (proprio/dedicado) persistido pelo wizard;
         configuravel aqui. Trocar para "proprio" exige confirmar o aviso;
         trocar para "dedicado" exige o numero pessoal (autorizado por allow). -->
    <div class="section" data-testid="wa-section">
      <h2>WhatsApp</h2>
      <div class="row">
        <div>
          <label for="wa-modo">Quem fala com o Garra</label>
          <div class="hint" id="wa-modo-hint">Carregando…</div>
        </div>
        <select id="wa-modo" data-testid="wa-modo"
                style="background:#1a1a24;color:#ddd;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:6px 8px;font-size:13px">
          <option value="dedicado">Só eu (dedicado)</option>
          <option value="proprio">Qualquer um (meu número)</option>
        </select>
      </div>
      <!-- Confirmacao para "proprio": a admissao so abre com o aviso marcado. -->
      <div class="row" id="wa-proprio-row" data-testid="wa-proprio-row" style="display:none">
        <label style="font-size:13px">
          <input type="checkbox" id="wa-proprio-confirmo" data-testid="wa-proprio-confirmo" />
          Entendo que qualquer pessoa que mandar mensagem recebe resposta.
        </label>
      </div>
      <!-- Numero pessoal para "dedicado". -->
      <div class="row" id="wa-dedicado-row" data-testid="wa-dedicado-row" style="display:none">
        <label for="wa-numero" style="font-size:13px">Seu número (com DDI)</label>
        <input type="text" id="wa-numero" data-testid="wa-numero" placeholder="+55 11 99999-8888"
               style="background:#1a1a24;color:#ddd;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:6px 8px;font-size:13px;width:160px" />
      </div>
      <div class="row">
        <button class="btn" id="wa-aplicar" data-testid="wa-aplicar">Aplicar modo</button>
        <button class="btn" id="wa-refazer" data-testid="wa-refazer">Refazer pareamento</button>
      </div>
      <div class="hint" id="wa-status" data-testid="wa-status" aria-live="polite" style="margin-top:8px"></div>
    </div>

    <div class="section">
      <h2>Updates</h2>
      <div class="row">
        <label>Current version: <span id="app-version">…</span></label>
        <button class="btn" id="check-update">Check for Updates</button>
      </div>
    </div>

    <div class="version">Garra Desktop <span id="app-version-footer">…</span></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
