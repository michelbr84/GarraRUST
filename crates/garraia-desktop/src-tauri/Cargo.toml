[package]
name = "garraia-desktop"
version.workspace = true
edition = "2024"
description = "Garra Desktop — Clippy-style AI assistant overlay"
license = "MIT"
rust-version.workspace = true

[lib]
name = "garraia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "garraia-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# #1240 — o desktop precisa da `gateway.api_key` para o handshake do
# /ws/parrot, e precisa dela do MESMO arquivo que o gateway le. Depender do
# dono do schema (em vez de parsear o YAML aqui) e o que impede as duas pontas
# de divergirem sobre qual config.yml vale.
garraia-config = { workspace = true }
# tokio::time::sleep no debounce de persistência da chat bar; o runtime em si
# já é o do Tauri (tauri::async_runtime), esta dep só dá acesso à API.
tokio = { workspace = true }

# Job Object do sidecar (gateway.rs) no Windows: a logica do KILL_ON_JOB_CLOSE
# vive no core sem Tauri (ADR 0021, testada no CI) e a casca so a aplica por
# PID. So no Windows — e la que o Job Object existe.
[target.'cfg(windows)'.dependencies]
garraia-desktop-core = { workspace = true }

