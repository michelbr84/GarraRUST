# ============================================
# GarraIA Configuration File (padrão)
# Caminho: %APPDATA%\garraia\config.yml
# ============================================
# Este arquivo é copiado automaticamente na primeira execução do Garra Desktop.
# Edite conforme necessário para configurar seus provedores de LLM.

gateway:
  host: "127.0.0.1"
  port: 3888

# ============================================
# LLM Providers
# ============================================

llm:
  # OpenRouter (nuvem) — PADRAO OFICIAL do GarraIA (issue #1180).
  # Uma chave so, muitos modelos.
  #
  # FALTA A CHAVE: descomente a linha `api_key` abaixo e cole a sua
  # (https://openrouter.ai/keys), ou exporte OPENROUTER_API_KEY no ambiente.
  # Enquanto ela nao existir, o Garra ignora este bloco e cai no fallback
  # local (Ollama). Nao deixe um valor de exemplo aqui: uma chave invalida
  # vira erro 401 em vez de um fallback limpo.
  openrouter:
    provider: "openrouter"
    model: "z-ai/glm-5.3-flash"
    base_url: "https://openrouter.ai/api/v1"
    # api_key: "sk-or-v1-SUA-CHAVE-AQUI"

  # Ollama (servidor local) — SEGUNDA opcao: fallback automatico quando a
  # nuvem nao responde. Veja `agent.fallback_providers` abaixo.
  ollama:
    provider: "ollama"
    model: "qwen3.8:latest"
    base_url: "http://localhost:11434"

  # LM Studio (servidor local alternativo — para uso 100% offline).
  # Descomente e aponte `agent.default_provider` para "lmstudio" se preferir.
  # Certifique-se de que o LM Studio esta rodando em http://localhost:1234
  # lmstudio:
  #   provider: "openai"
  #   model: "local-model"
  #   base_url: "http://localhost:1234/v1"
  #   api_key: "lm-studio"

# ============================================
# Agent Configuration
# ============================================

agent:
  system_prompt: |
    Voce e o GarraIA, um assistente de IA pessoal avancado, com memoria persistente e consciencia contextual.

    Caracteristicas principais:
    - Voce possui memoria persistente sobre o usuario
    - Voce deve usar os fatos carregados automaticamente
    - Voce deve responder naturalmente em portugues
    - Voce deve ser util, preciso e tecnico quando necessario

    IMPORTANTE:
    - NAO use ferramentas sem necessidade
    - NAO invente informacoes
    - Para mensagens simples, responda apenas com texto

  # Issue #1180: nuvem primeiro, local como segunda opcao.
  default_provider: "openrouter"
  fallback_providers:
    - "ollama"
  max_tokens: 2048
  max_context_tokens: 12000
  max_history_messages: 10
  max_tool_calls: 50
  tool_confirmation_enabled: false

# ============================================
# Timeouts (em segundos)
# ============================================

timeouts:
  llm:
    default_secs: 120
  mcp:
    default_secs: 60

# ============================================
# Voice (TTS / STT)
# ============================================

voice:
  enabled: true
  tts_provider: "lmstudio"
  tts_model: "vieneu-tts-v2-turbo"
  tts_endpoint: "http://127.0.0.1:1234"
  stt_endpoint: "http://127.0.0.1:1234"
  language: "pt"

# ============================================
# Embeddings
# ============================================

embeddings:
  lmstudio:
    provider: "openai"
    model: "text-embedding-mxbai-embed-large-v1"
    base_url: "http://localhost:1234"
    api_key: "lm-studio"

# ============================================
# Memory
# ============================================

memory:
  enabled: true
  embedding_provider: "lmstudio"
