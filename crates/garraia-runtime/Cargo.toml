[package]
name = "garraia-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# Literal, nao `.workspace = true`: esta crate ainda nao herda do
# [workspace.package] (version 0.1.0 e edition 2021 proprios). Migrar a
# heranca inteira mudaria version e edition junto, o que nao e desta fatia.
rust-version = "1.95"
description = "Runtime principal do GarraIA — state machine, meta-controller e executor"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

garraia-common = { path = "../garraia-common" }
garraia-tools = { path = "../garraia-tools" }
