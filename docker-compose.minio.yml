# MinIO dev-only compose (ROADMAP §7.4 — "MinIO ainda ausente").
#
# Usage:
#   docker compose -f docker-compose.minio.yml up -d
#
# Console: http://localhost:9001 (minioadmin/minioadmin — DEV ONLY).
# S3 API:  http://localhost:9000
#
# Wire the gateway to it:
#   GARRAIA_STORAGE_S3_BUCKET=garraia-dev
#   GARRAIA_STORAGE_S3_REGION=us-east-1
#   GARRAIA_STORAGE_S3_ENDPOINT=http://localhost:9000
#   GARRAIA_STORAGE_S3_FORCE_PATH_STYLE=true
#   GARRAIA_STORAGE_S3_ACCESS_KEY_ID=minioadmin
#   GARRAIA_STORAGE_S3_SECRET_ACCESS_KEY=minioadmin
#
# ⚠️ Default credentials — NEVER use this file outside local dev.

services:
  minio:
    # quay.io, nao Docker Hub: o repositorio `minio/minio` foi REMOVIDO de la
    # (o registry responde "object not found" e o pull morre com "pull access
    # denied") — #1230. Tag fixado no mesmo release que o testcontainer da
    # suite de integracao usa, para que dev local e CI subam o mesmo binario.
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: garraia-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Sem KMS o MinIO recusa SSE-S3 com `NotImplemented` (HTTP 501), e como
      # ADR 0004 exige `x-amz-server-side-encryption: AES256` em todo `put`,
      # o gateway nao conseguiria gravar UM objeto sequer contra este MinIO.
      # Esta e a chave de teste do KMS embutido, dev-only como as credenciais
      # acima: `<nome>:<32 bytes em base64>`.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-garraia-dev-key:fSOpM1BeqF34Pymx26rxbRKKT+XNUJBlgyRFtJvmlyY=}
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc` vem dentro da imagem do servidor; mantido como estava porque nao
      # houve como confirmar o conteudo deste tag sem um daemon Docker. Se
      # falhar como "executable not found", trocar por
      # `curl -f http://localhost:9000/minio/health/live`.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: creates the `garraia-dev` bucket on boot.
  minio-init:
    # Idem quay.io. O `mc` tem ciclo de release proprio, com tags de data
    # diferentes das do servidor, entao aqui fica `latest`: fixar o tag do
    # servidor apontaria para uma tag que nao existe neste repositorio.
    image: quay.io/minio/mc:latest
    container_name: garraia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/garraia-dev &&
      echo 'bucket garraia-dev ready'"

volumes:
  minio-data:
