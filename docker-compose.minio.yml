# MinIO dev-only compose (ROADMAP §7.4 — "MinIO ainda ausente").
#
# Usage:
#   docker compose -f docker-compose.minio.yml up -d
#
# Console: http://localhost:9001 (minioadmin/minioadmin — DEV ONLY).
# S3 API:  http://localhost:9000
#
# Wire the gateway to it:
#   GARRAIA_STORAGE_S3_BUCKET=garraia-dev
#   GARRAIA_STORAGE_S3_REGION=us-east-1
#   GARRAIA_STORAGE_S3_ENDPOINT=http://localhost:9000
#   GARRAIA_STORAGE_S3_FORCE_PATH_STYLE=true
#   GARRAIA_STORAGE_S3_ACCESS_KEY_ID=minioadmin
#   GARRAIA_STORAGE_S3_SECRET_ACCESS_KEY=minioadmin
#
# ⚠️ Default credentials — NEVER use this file outside local dev.

services:
  minio:
    # Esta imagem NAO vem de registry nenhum (#1458): o Docker Hub removeu
    # `minio/minio` (#1230) e o quay.io passou a exigir login em 2026-09-24.
    # Ela e construida localmente, a partir do fonte da mesma tag que o
    # testcontainer da suite de integracao usa, por:
    #
    #   scripts/ci/build-minio-image.sh
    #
    # Rode isso UMA vez antes do `docker compose up` (precisa so de Docker; o
    # Go roda dentro de um container). `pull_policy: never` faz o compose
    # dizer "imagem nao encontrada" em vez de morrer num 401 do quay.io.
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    pull_policy: never
    container_name: garraia-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Sem KMS o MinIO recusa SSE-S3 com `NotImplemented` (HTTP 501), e como
      # ADR 0004 exige `x-amz-server-side-encryption: AES256` em todo `put`,
      # o gateway nao conseguiria gravar UM objeto sequer contra este MinIO.
      # Esta e a chave de teste do KMS embutido, dev-only como as credenciais
      # acima: `<nome>:<32 bytes em base64>`.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-garraia-dev-key:fSOpM1BeqF34Pymx26rxbRKKT+XNUJBlgyRFtJvmlyY=}
    volumes:
      - minio-data:/data
    healthcheck:
      # A imagem construida pelo script traz so o `minio` sobre
      # debian:bookworm-slim — sem `mc` e sem `curl`. O bash da base abre um
      # socket TCP na porta da API: e prova de que o servidor esta ouvindo,
      # suficiente para o `depends_on` do init.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: creates the `garraia-dev` bucket on boot.
  minio-init:
    # `quay.io/minio/mc` fechou junto com o servidor (#1458). O `aws-cli`
    # oficial da Amazon continua publico no Docker Hub e fala S3 com qualquer
    # endpoint; `latest` pelo mesmo motivo que o `mc:latest` de antes — o
    # ciclo de release dele nao tem relacao com a tag do servidor.
    image: amazon/aws-cli:latest
    container_name: garraia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
      aws s3api head-bucket --bucket garraia-dev 2>/dev/null ||
      aws s3api create-bucket --bucket garraia-dev &&
      echo 'bucket garraia-dev ready'"

volumes:
  minio-data:
