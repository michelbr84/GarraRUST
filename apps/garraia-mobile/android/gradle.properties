org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# `org.gradle.java.home` is deliberately NOT set here. A previous revision
# pinned it to `C:/Program Files/Java/jdk-23`, which made every Linux/macOS
# build — including CI — fail before Gradle even started. Pick the JDK per
# machine through JAVA_HOME (or ~/.gradle/gradle.properties), never in the
# repo.
