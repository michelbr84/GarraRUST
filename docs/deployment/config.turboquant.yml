# Configuração do GarraIA para implantação local com Docker e TurboQuant+
# Conecta-se ao serviço 'llama-turboquant' do docker-compose.turboquant.yml,
# que serve o fork TurboQuant+ do llama.cpp com compressão de KV cache.
#
# Montado read-only pelo compose em /home/garraia/.config/garraia/config.yml.

# #1261: o bind nao mora mais aqui. `gateway.host`/`gateway.port` estao
# deprecados (o `garraia start` nunca os leu): o Dockerfile passa
# `--host 0.0.0.0`, e `HOST`/`PORT` do ambiente valem como sempre.
#
# Num bind nao-loopback o `garraia start` RECUSA subir sem credencial de
# gateway. Este arquivo e montado somente-leitura pelo compose, entao a
# credencial vem do ambiente: defina GARRAIA_GATEWAY_API_KEY (no `.env` ou
# no painel do RunPod) com um segredo longo e aleatorio, por exemplo
# `openssl rand -hex 32`. Nunca commite esse valor.

llm:
  # Serviço local do llama.cpp TurboQuant+ (keyless)
  llamacpp-turboquant:
    provider: llamacpp
    # Ajuste o modelo conforme necessário (deve existir em ./models/ e
    # TURBOQUANT_MODEL no .env aponta para ele, ex.: "models/Qwen3-8B-Q4_K_M.gguf")
    model: models/model.gguf
    # Aponta para o serviço 'llama-turboquant' definido no docker-compose.turboquant.yml
    base_url: "http://llama-turboquant:8080"

agent:
  system_prompt: "Você é o GarraIA, um assistente de inteligência artificial executando localmente através do llama.cpp TurboQuant+."
  default_provider: llamacpp-turboquant

# Habilite os canais conforme necessário
channels:
  telegram:
    type: telegram
    enabled: false
    # bot_token é resolvido automaticamente a partir da variável de ambiente TELEGRAM_BOT_TOKEN
