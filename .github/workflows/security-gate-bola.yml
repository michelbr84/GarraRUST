name: Security Gate (BOLA)

# Security Gate: Broken Object-Level Authorization & Cross-Tenant Isolation
#
# Runs feature-gated integration test suites (`--features test-helpers`) in
# `garraia-gateway` against a dedicated ephemeral PostgreSQL 16 + pgvector service.
#
# These tests exercise strict multi-tenant isolation, RLS enforcement,
# RBAC permission matrices, cross-group ID access rejection (404/403),
# and session tenant scoping.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: bola-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bola-gate:
    name: Security Gate (BOLA & Tenant Isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: garraia_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Este é o único job que restaura `target/` do cache (o ci.yml cacheia
      # só `~/.cargo/registry`), e o runner ubuntu-latest tem ~14 GB livres.
      # Desde a v0.3.4 o OpenSSL é vendored (`native-tls/vendored`, ver
      # Cargo.toml raiz), então o openssl-src compila o OpenSSL dentro de
      # `target/` e engorda o cache: o primeiro run com a mudança passou e
      # salvou o cache maior, e os dois seguintes morreram ~4 min dentro do
      # `cargo test` — sem logs, sem post-steps, assinatura de runner morto
      # por disco. Mesmo bloco (e mesma causa) do job `coverage` do ci.yml,
      # que documenta o `No space left on device` verificado no PR #90.
      # Inline `rm -rf` em vez de action externa para manter a superfície de
      # supply-chain em zero, igual ao ci.yml. O `docker image prune` não
      # toca a imagem do serviço postgres: ela está em uso por um container
      # rodando, e o docker não remove imagem referenciada.
      - name: Free up disk space (GHA runner default ~14 GB → ~26 GB)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bola-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bola-

      - name: Run Gateway Authz & Multi-Tenant Tests
        env:
          GARRAIA_TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/garraia_workspace_test
        run: |
          cargo test -p garraia-gateway --features test-helpers
