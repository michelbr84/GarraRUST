name: Docs site

# Build do site Docusaurus (website/) em PR; publicacao no GitHub Pages a cada
# push na main. Independente do ci.yml — nao toca em nenhum job dele.

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'wiki/**'
      - '.github/workflows/docs-site.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'wiki/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # So em PR: compila os dois locales e sobe o build como artifact.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Sync docs from repo markdown
        run: npm run sync
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: website/build
          if-no-files-found: error

  deploy:
    # Push na main (ou dispatch): publica no GitHub Pages.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Sync docs from repo markdown
        run: npm run sync
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
