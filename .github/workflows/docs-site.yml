name: Docs site

# Build do site Docusaurus (website/) em PR; publicacao no GitHub Pages a cada
# push na main. Independente do ci.yml — nao toca em nenhum job dele.

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'wiki/**'
      - '.github/workflows/docs-site.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'CONTRIBUTING.md'
      - 'wiki/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # So em PR: compila os dois locales e sobe o build como artifact.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Sync docs from repo markdown
        run: npm run sync
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: website/build
          if-no-files-found: error

  build-pages:
    # Push na main (ou dispatch): compila o site e sobe o artifact
    # `github-pages`. Quem publica e o job `deploy`, abaixo — e por que ficam
    # separados esta no comentario dele.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      - name: Sync docs from repo markdown
        run: npm run sync
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    # Publica no GitHub Pages o artifact que o `build-pages` subiu.
    #
    # Job separado de proposito. Com upload e deploy no mesmo job, o
    # `actions/deploy-pages` lista os artifacts do run uns 0,4 s depois de o
    # `upload-pages-artifact` finalizar o `github-pages`, e a listagem do
    # servico de artifacts as vezes ainda nao o enxerga: o passo falha com
    # "Found 0 artifact(s)" com o artifact ja finalizado e visivel na API logo
    # em seguida. Foram quatro falhas assim em 2026-11-25, intercaladas com
    # deploys que passaram na mesma distancia — corrida, nao configuracao.
    # O `needs` so deixa este job comecar depois que o `build-pages` termina,
    # e um runner novo leva segundos para subir: tempo de sobra para a listagem
    # alcancar o upload. E o arranjo do exemplo do README do `deploy-pages`.
    #
    # Se mesmo assim falhar, "Re-run failed jobs" passa a ser o conserto: so o
    # `deploy` roda de novo e reaproveita o artifact. No arranjo antigo o
    # re-run subia um segundo `github-pages` no mesmo run e o deploy falhava
    # com "Multiple artifacts" — so um run novo resolvia.
    #
    # Retry automatico no proprio passo nao e opcao: tentar de novo exigiria
    # `continue-on-error` na primeira tentativa, que este repo proibe.
    needs: build-pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
