# Sonda dos endpoints públicos de instalação.
#
# Por que existe: em 2026-08 o `irm https://garraia.org/install.ps1 | iex`
# devolvia o HTML da home com HTTP 200 — não um 404 — porque a rota caía no
# fallback SPA do site. O `irm` baixava a home e o `iex` tentava executá-la.
# Nenhum teste do repositório podia pegar isso: o site é publicado fora daqui.
#
# Segundo apagão (2026-08-31, run #1 deste workflow): o hosting da Lovable
# IGNORA `public/_redirects` — o garraia.org serve os instaladores como
# arquivos ESTÁTICOS `public/install.{sh,ps1}` do repo do site. Faltava o
# `public/install.ps1`, então a URL devolvia 404 puro. E este workflow morria
# no primeiro curl com erro HTTP (exit 22) sem imprimir diagnóstico nenhum:
# `shell: bash` roda com `-e -o pipefail` implícitos, e o `set -uo pipefail`
# daqui não desligava o `-e` — toda a contabilidade de failures era código
# morto. Daí as duas regras do script atual: nenhum comando falível fora de
# guarda `|| var=$?`, e o código HTTP de cada sonda SEMPRE aparece no log.
#
# Terceiro apagão (2026-09-18, run #27): o serving do garraia.org mudou sem
# nenhum publish novo — sem commit no repo do site desde 2026-09-05 e com o
# corpo servido byte-idêntico ao de véspera. Dois sintomas juntos: os
# instaladores passaram a sair como `application/octet-stream` (o irm
# devolveria byte[] e o `| iex` quebra para o usuário real) e a borda passou
# a recusar com HTTP 403 o cliente .NET do Invoke-RestMethod vindo de IP de
# datacenter — o curl do MESMO runner recebe 200 no mesmo minuto, e de IP
# residencial qualquer User-Agent passa, então o bloqueio não é nem de IP
# nem de UA: é do fingerprint do cliente .NET. Efeito prático: a sonda irm
# não consegue MAIS exercitar o cliente de verdade contra o garraia.org
# a partir de runners. O que segue asserível pelo cliente que a borda
# aceita é o fato do lado servidor — o Content-Type servido e a assinatura
# do corpo — e é isso que o fallback curl do passo irm abaixo faz quando
# leva 403: a asserção do contrato permanece (octet-stream deixa o run
# vermelho), só a fidelidade do cliente é que degrada, avisada.
#
# Por que NÃO é gate de PR: estas asserções falam do estado *implantado*, que
# um PR não tem como consertar. Um deploy ruim do site travaria todo PR do
# core. Roda no schedule e sob demanda; a falha vira notificação, não bloqueio.
name: Install endpoints

on:
  schedule:
    # 06:00 UTC diariamente — cedo o suficiente para o mantenedor ver antes
    # de o dia começar na Flórida.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe public installer URLs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Probe every documented installer URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `shell: bash` = `bash --noprofile --norc -e -o pipefail`. O `-e`
          # implícito matou o run #1 no primeiro HTTP 404 (exit 22, zero
          # diagnóstico). Regra do script: todo comando falível é capturado
          # com `|| var=$?` e probe() SEMPRE retorna 0 — uma sonda vermelha
          # não pode impedir as outras de rodar.
          set -u

          failures=0
          workdir="$(mktemp -d)"

          # Marcador de frescor do install.sh servido — ver a guarda em
          # probe(). `TERMUX_VERSION` entrou com o ramo Android da v0.3.6
          # (ADR 0016) e é o ramo cuja ausência quebra silenciosamente uma
          # plataforma inteira.
          FRESHNESS_MARKER="TERMUX_VERSION"

          # fail <label> <mode> <mensagem> — ::error e conta, ou ::warning.
          # O modo warn continua disponível como 4º argumento do probe()
          # para futuras tolerâncias temporárias; nenhum probe atual o usa.
          fail() {
            if [ "$2" = "warn" ]; then
              echo "::warning ::$1: $3 (tolerado)"
            else
              echo "::error ::$1: $3"
              failures=$((failures + 1))
            fi
          }

          # Assinatura de cada script. `install.sh` começa com o shebang;
          # `install.ps1` começa com o bloco de ajuda comment-based `<#`.
          probe() {
            label="$1"; url="$2"; expected="$3"; on_fail="${4:-error}"
            body_file="${workdir}/body"
            rm -f "${body_file}"

            echo "::group::${label}"
            echo "URL: ${url}"

            http_code=""; curl_status=0
            http_code="$(curl -sSL --retry 3 --retry-delay 2 --max-time 60 \
              -o "${body_file}" -w '%{http_code}' "${url}")" || curl_status=$?

            if [ "${curl_status}" -ne 0 ]; then
              # Sem -f e sem 2>/dev/null: o erro real do curl (DNS/TLS/
              # timeout) já saiu no stderr logo acima.
              fail "${label}" "${on_fail}" \
                "curl falhou (exit ${curl_status}) em ${url} (HTTP ${http_code:-n/a})"
              echo "::endgroup::"; return 0
            fi

            if [ "${http_code}" != "200" ]; then
              fail "${label}" "${on_fail}" "HTTP ${http_code} em ${url}"
              echo "::endgroup::"; return 0
            fi

            head_bytes="$(head -c 4096 "${body_file}")" || head_bytes=""

            # O modo de falha do primeiro apagão: HTTP 200 com HTML no corpo.
            case "${head_bytes}" in
              *"<!DOCTYPE"*|*"<!doctype"*|*"<html"*)
                fail "${label}" "${on_fail}" \
                  "HTTP 200 mas o corpo é HTML — o fallback SPA do site está engolindo ${url}"
                head -5 "${body_file}"
                echo "::endgroup::"; return 0
                ;;
            esac

            case "${head_bytes}" in
              "${expected}"*) : ;;
              *)
                fail "${label}" "${on_fail}" \
                  "corpo não começa com a assinatura esperada (${expected})"
                head -5 "${body_file}"
                echo "::endgroup::"; return 0
                ;;
            esac

            # Fidelidade extra para shell: o corpo INTEIRO precisa parsear —
            # pega truncamento/corrupção que a assinatura não vê.
            if [ "${expected}" = "#!/bin/sh" ]; then
              sh_status=0
              sh -n "${body_file}" || sh_status=$?
              if [ "${sh_status}" -ne 0 ]; then
                fail "${label}" "${on_fail}" \
                  "corpo não passa em 'sh -n' (truncado/corrompido?)"
                echo "::endgroup::"; return 0
              fi

              # Guarda de FRESCOR, e o terceiro modo de falha desta rota.
              #
              # Os dois primeiros apagões eram sobre o endpoint existir
              # (HTML em 200; depois 404 puro). Este é sobre ele existir e
              # estar VELHO: o garraia.org serve uma cópia estática do
              # public/ do repo do site, sincronizada por cron diário e
              # publicada MANUALMENTE no Lovable. Um install.sh de antes do
              # ramo Termux passa em shebang, em 'sh -n' e em HTTP 200 — e
              # ainda assim entrega o binário glibc para quem está no
              # Termux, que não roda no Android (issue #910).
              #
              # ${FRESHNESS_MARKER} é a evidência mais recente de que a
              # cópia servida acompanhou o main. Ao adicionar um ramo novo
              # e load-bearing ao install.sh, mova o marcador para ele.
              if ! grep -q "${FRESHNESS_MARKER}" "${body_file}"; then
                fail "${label}" "${on_fail}" \
                  "corpo é um install.sh DESATUALIZADO — sem '${FRESHNESS_MARKER}' (o publish do site é manual; republique no Lovable)"
                echo "::endgroup::"; return 0
              fi
            fi

            echo "OK — HTTP 200, assinatura ${expected}"
            echo "::endgroup::"
            return 0
          }

          # --- probes --------------------------------------------------------

          # --- canal primário: o que a documentação e o site mandam usar -----
          probe "garraia.org/install.sh"  "https://garraia.org/install.sh"  "#!/bin/sh"
          probe "garraia.org/install.ps1" "https://garraia.org/install.ps1" "<#"

          # --- espelhos oficiais ---------------------------------------------
          probe "raw/install.sh" \
            "https://raw.githubusercontent.com/michelbr84/GarraRUST/main/install.sh" "#!/bin/sh"
          probe "raw/install.ps1" \
            "https://raw.githubusercontent.com/michelbr84/GarraRUST/main/install.ps1" "<#"
          probe "jsdelivr/install.sh" \
            "https://cdn.jsdelivr.net/gh/michelbr84/GarraRUST@main/install.sh" "#!/bin/sh"
          probe "jsdelivr/install.ps1" \
            "https://cdn.jsdelivr.net/gh/michelbr84/GarraRUST@main/install.ps1" "<#"
          probe "release-cdn/install.sh" \
            "https://github.com/michelbr84/GarraRUST/releases/latest/download/install.sh" "#!/bin/sh"
          probe "release-cdn/install.ps1" \
            "https://github.com/michelbr84/GarraRUST/releases/latest/download/install.ps1" "<#"

          if [ "${failures}" -ne 0 ]; then
            echo "::error ::${failures} endpoint(s) de instalação quebrados"
            exit 1
          fi
          echo "Todos os endpoints de instalação servem o script correto."

      # Roda mesmo com o step anterior vermelho: cada step contribui o seu
      # diagnóstico, e qualquer um dos dois falhando derruba o job.
      - name: Probe irm fidelity (contrato do one-liner Windows)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # O que o usuário Windows roda de verdade é `irm <url> | iex`. Um
          # servidor que responda `application/octet-stream` faz o irm
          # devolver byte[] em vez de [string], e o `| iex` quebra MESMO com
          # o conteúdo byte-perfeito — modo de falha que a sonda curl acima
          # não enxerga. (Restrição relacionada: install.ps1 precisa
          # continuar ASCII puro — o irm do PowerShell 5.1 decodifica
          # ISO-8859-1 quando o servidor não manda charset.)
          $failures = 0
          $urls = @(
            'https://garraia.org/install.ps1',
            'https://raw.githubusercontent.com/michelbr84/GarraRUST/main/install.ps1'
          )
          foreach ($url in $urls) {
            Write-Host "::group::irm $url"
            try {
              $body = Invoke-RestMethod -Uri $url `
                -MaximumRetryCount 3 -RetryIntervalSec 2 -TimeoutSec 60
              if ($body -isnot [string]) {
                Write-Host "::error ::irm ${url}: devolveu $($body.GetType().Name), não [string] — o Content-Type do servidor quebra 'irm | iex'"
                $failures++
              } elseif (-not $body.StartsWith('<#')) {
                $head = $body.Substring(0, [Math]::Min(80, $body.Length)) -replace "`r?`n", ' '
                Write-Host "::error ::irm ${url}: corpo não começa com '<#' (início: $head)"
                $failures++
              } else {
                Write-Host "OK — [string] de $($body.Length) chars começando com '<#'"
              }
            } catch {
              $code = try { [int]$_.Exception.Response.StatusCode } catch { 'n/a' }
              if ($code -eq 403 -and $url.Contains('garraia.org')) {
                # A borda do site recusa o cliente .NET de IP de datacenter
                # (curl no mesmo runner passa; usuário real em IP residencial
                # passa — ver o terceiro apagão no cabeçalho). O contrato do
                # lado servidor segue asserido pelo cliente que a borda
                # aceita: HTTP 200, Content-Type texto (o que o irm precisa
                # para devolver [string]) e corpo começando com '<#'. Um
                # octet-stream aqui continua deixando o run vermelho.
                Write-Host "::warning ::irm ${url}: HTTP 403 — a borda recusa o cliente .NET de datacenter; asserindo o contrato via curl"
                $probe = (& curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 60 $url 2>$null) -split ' ', 2
                $http = $probe[0]; $ctype = $probe[1]
                if ($http -ne '200') {
                  Write-Host "::error ::irm ${url} (fallback curl): HTTP ${http}"
                  $failures++
                } elseif ($ctype -notmatch '^text/') {
                  Write-Host "::error ::irm ${url} (fallback curl): Content-Type '$ctype' — o irm devolveria byte[], não [string]; 'irm | iex' quebra"
                  $failures++
                } else {
                  $tmp = New-TemporaryFile
                  & curl -s --max-time 60 -o $tmp $url 2>$null
                  $raw = Get-Content -Raw -ErrorAction SilentlyContinue $tmp
                  Remove-Item $tmp -ErrorAction SilentlyContinue
                  if (-not $raw -or -not $raw.StartsWith('<#')) {
                    $head = if ($raw) { ($raw.Substring(0, [Math]::Min(80, $raw.Length)) -replace "`r?`n", ' ') } else { '(vazio)' }
                    Write-Host "::error ::irm ${url} (fallback curl): corpo não começa com '<#' (início: $head)"
                    $failures++
                  } else {
                    Write-Host "OK (fallback curl) — HTTP 200, Content-Type '$ctype', corpo começa com '<#'"
                  }
                }
              } else {
                Write-Host "::error ::irm ${url}: HTTP $code — $($_.Exception.Message)"
                $failures++
              }
            }
            Write-Host '::endgroup::'
          }
          if ($failures -ne 0) { exit 1 }
