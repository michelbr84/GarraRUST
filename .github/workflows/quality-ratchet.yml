name: Quality Ratchet

# AI Quality Ratchet — observation-only on PR-1.
# Plan: plans/0064-quality-ratchet-pr1.md
# Mode: ALWAYS exit 0 in PR-1 via `compare.py --mode report-only`. Promotion to
# `--mode enforce` is PR-4 work, with explicit owner approval.
#
# Design invariants (per plan 0064):
#   - NO `continue-on-error: true` (Michel ajuste #1). Mode is controlled by
#     the explicit `--mode report-only` flag on compare.py.
#   - Trigger is `pull_request` ONLY — NOT `workflow_run` (Michel ajuste #3).
#     Coverage is best-effort: if `lcov.info` from the parallel `coverage` job
#     in `ci.yml` lands as a downloadable artifact, we use it; else the report
#     marks coverage as `not_collected_this_run`.
#   - Fork PRs: comment posting is skipped (head.repo.full_name guard, same
#     pattern as the `coverage` job in ci.yml).
#   - Per-PR signal (#1254): on `pull_request` the metrics of the merge-base
#     (`pull_request.base.sha`) are collected in a separate worktree and fed to
#     `compare.py --base`, so the comment says what THIS PR changed instead of
#     repeating the same diff against a stale `.quality/baseline.json`. On
#     `push` to main there is no base and the report is the historical one.
#     `--base` never changes the exit code. Event inputs reach the shell via
#     `env:`, never interpolated into `run:`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write   # required for `gh pr comment`

jobs:
  ratchet:
    name: Quality Ratchet (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # #1228 (slice E): the comment upsert used below has its own tests.
      # #1566: the suite also covers `scripts/ci/coverage_gate.py`, which is
      # consumed by the `coverage` job of ci.yml, not by this workflow. This is
      # the only place `scripts/ci/tests` runs on a PR, so it stays blocking.
      # Separate pytest invocation: every scripts/*/tests suite is a package
      # named `tests`, and collecting two of them in one run breaks.
      - name: Tests of scripts/ci (comment upsert + coverage gate)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/ci/tests -q

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq

      - name: Install cargo-audit (best-effort)
        # cargo-audit is fast (~30 s install, ~3 s run on warm cache). The
        # parser handles the case where this step fails (parse-cargo-audit.py
        # falls back to status="not_collected_this_run").
        run: cargo install --locked --version '^0.22' cargo-audit

      - name: Try downloading lcov.info from parallel coverage job (best-effort)
        # The coverage job in ci.yml uploads `coverage-lcov-${{ github.run_id }}`,
        # but ci.yml and quality-ratchet.yml are SEPARATE workflows triggered
        # in parallel by the same PR push. Their `github.run_id` differs, so
        # we cannot use actions/download-artifact directly; we look the run up
        # by commit via the gh API instead.
        #
        # #1566: looking up ONLY the head SHA made `coverage_pct` null on every
        # single run, deterministically — not intermittently. This job is
        # `timeout-minutes: 10` and does ~2-3 min of work; the `coverage` job is
        # `timeout-minutes: 45` and takes 21-30 min. So when we look, the
        # ci.yml run for this SHA is still `in_progress` with `conclusion: null`,
        # the `conclusion == "success"` filter drops it, and we download
        # nothing. The ratchet always loses that race.
        #
        # The invariant from plan 0064 ("ajuste #3": trigger is `pull_request`,
        # never `workflow_run`) is what makes the race unavoidable, and it
        # stays. So we fall back to the newest successful ci.yml run on `main`
        # and report WHERE the number came from, which beats printing `None`
        # and calling coverage unmeasured. The PR's own number still lands only
        # on a later re-run of this job — documented in
        # `docs/coverage-baseline-2026-10.md`, not a bug to rediscover.
        #
        # Still best-effort in both branches: no failure here can fail the job.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Newest COMPLETED successful ci.yml run for a given ref/commit.
          # `--limit 20` because the newest run for a SHA is routinely still
          # in progress (see above) and older re-runs may have finished.
          newest_success() {
            gh run list --repo "$REPO" --workflow ci.yml "$1" "$2" \
              --limit 20 --json databaseId,status,conclusion \
              --jq 'map(select(.status == "completed" and .conclusion == "success"))
                    | .[0].databaseId // empty' 2>/dev/null || true
          }

          fetch_lcov() {
            gh run download "$1" --repo "$REPO" \
              --name "coverage-lcov-$1" --dir . 2>/dev/null
          }

          source_label=""

          run_id=$(newest_success --commit "$HEAD_SHA")
          if [ -n "${run_id:-}" ] && fetch_lcov "$run_id"; then
            source_label="this commit (${HEAD_SHA:0:8}), ci.yml run $run_id"
          else
            echo "No finished ci.yml coverage for ${HEAD_SHA:0:8} yet; falling back to main."
            run_id=$(newest_success --branch main)
            if [ -n "${run_id:-}" ] && fetch_lcov "$run_id"; then
              sha=$(gh run view "$run_id" --repo "$REPO" --json headSha \
                      --jq '.headSha // empty' 2>/dev/null || true)
              source_label="main (${sha:0:8}), ci.yml run $run_id — NOT this PR"
            fi
          fi

          if [ -s lcov.info ]; then
            echo "lcov.info from: $source_label"
            {
              echo "## Coverage source"
              echo ""
              echo "\`lcov.info\` used by this report came from **$source_label**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no lcov.info) — coverage best-effort skipped"
            {
              echo "## Coverage source"
              echo ""
              echo "No \`lcov.info\` available; coverage reported as not collected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect metrics (fast mode)
        run: bash scripts/quality/collect-metrics.sh > current-metrics.json

      - name: Show collected metrics
        run: |
          echo "::group::current-metrics.json"
          jq '.' current-metrics.json
          echo "::endgroup::"

      - name: "Collect merge-base metrics (pull_request only — #1254)"
        # The checkout is the PR merge commit, so current-metrics.json already
        # includes main. Measuring `base.sha` (the tip of the target branch at
        # event time) in its own worktree isolates what this PR adds. The
        # collector honours GARRAIA_REPO_ROOT (`cd` before any `git`/`cargo`),
        # while the parsers still come from the PR's own scripts/quality/, so
        # both snapshots are produced by the same tooling. fetch-depth is 1,
        # hence the explicit fetch of the SHA before the worktree is created.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/base "$BASE_SHA"
          GARRAIA_REPO_ROOT=/tmp/base bash scripts/quality/collect-metrics.sh > base-metrics.json
          echo "::group::base-metrics.json"
          jq '.' base-metrics.json
          echo "::endgroup::"

      - name: Compare against baseline (report-only — always exit 0)
        # PR-1: --mode report-only. The flag is the SINGLE source of truth for
        # "report-only vs enforce" — we explicitly do NOT use `continue-on-error`.
        # `--base` only adds the per-PR delta column and verdict (#1254); it is
        # passed on pull_request only and never affects the exit code.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_args=(--base base-metrics.json)
          fi
          python3 scripts/quality/compare.py \
            --mode report-only \
            .quality/baseline.json \
            current-metrics.json \
            --report quality-report.md \
            ${base_args[@]+"${base_args[@]}"}

      - name: Upload quality-report artifact
        uses: actions/upload-artifact@v7
        with:
          name: quality-report-${{ github.run_id }}
          path: |
            quality-report.md
            current-metrics.json
            base-metrics.json
          retention-days: 90
          if-no-files-found: error

      - name: Append summary to GitHub Step Summary
        run: |
          echo "## Quality Ratchet — report-only" >> "$GITHUB_STEP_SUMMARY"
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post quality-report.md as PR comment
        # Skip on push events AND on fork PRs (same fork-safe guard as the
        # coverage job in ci.yml — Michel ajuste #3).
        #
        # #1228 (slice E): edits ONE comment in place on every push instead of
        # adding a new one. `upsert_pr_comment.py` finds it by the marker
        # `<!-- quality-ratchet-comment -->` (written by compare.py) AND by the
        # author `github-actions[bot]`, so a human comment quoting the marker
        # is never overwritten. Event data reaches the shell via `env:`.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/ci/upsert_pr_comment.py \
            --repo "$REPO" --pr "$PR_NUMBER" \
            --marker '<!-- quality-ratchet-comment -->' --body-file quality-report.md
