name: Docker build (sem push)

# O `deploy.yml` so constroi a imagem em push de tag. Entre uma tag e outra,
# nada no CI de PR exercita o Dockerfile — foi assim que o `[patch.crates-io]`
# para `third_party/` (#1668, 2026-10-20) quebrou o Deploy sem ninguem ver ate
# o tag v0.4.10-rc1. Este workflow constroi a mesma imagem (so linux/amd64,
# SEM login e SEM push) quando muda algo que o Dockerfile consome fora de
# `crates/`, e prova que o binario dentro dela roda.
#
# O teste `dockerfile_copies_every_patch_path_outside_crates` (garraia-channels)
# segura a regra estrutural em todo PR; este job e a prova de ponta a ponta.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      # Bump de dependencia muda o grafo sem tocar o Cargo.toml — e um
      # `rust-version` acima do `rust:*-slim` da imagem ja derrubou o Deploy
      # do tag v0.3.0.
      - 'Cargo.lock'
      - 'third_party/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker build (linux/amd64, sem push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` deixa a imagem no daemon local do runner para o smoke
      # abaixo. Cache num escopo proprio: le o do Deploy (escopo padrao) mas
      # nao escreve nele.
      - name: Build (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: garraia:pr-check
          cache-from: |
            type=gha
            type=gha,scope=docker-pr
          cache-to: type=gha,scope=docker-pr,mode=max

      - name: Smoke da imagem (versao + /ping)
        run: |
          set -euo pipefail
          docker run --rm garraia:pr-check --version
          # O bind nao-loopback exige credencial do gateway (#1261); uma
          # descartavel, gerada aqui, nunca gravada na imagem.
          key="$(openssl rand -hex 32)"
          docker run -d --name garraia-smoke -p 3888:3888 \
            -e GARRAIA_GATEWAY_API_KEY="$key" garraia:pr-check
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3888/ping >/dev/null; then
              echo "PING OK: o gateway da imagem respondeu /ping"
              docker rm -f garraia-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error ::o gateway da imagem nao respondeu /ping em 120 s"
          docker logs garraia-smoke 2>&1 | tail -60
          docker rm -f garraia-smoke >/dev/null || true
          exit 1
