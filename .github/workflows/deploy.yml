name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v0.3.0, latest)'
        required: false
        default: 'latest'
        type: string
      latest:
        description: 'Also move the `latest` tag to this build (dispatch only; a tag push never moves it)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/garraia

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Build & push multi-arch Docker image
  # --------------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Dispatch manual com `tag=vX.Y.Z` produz o MESMO conjunto de tags que o
      # push do tag (`X.Y.Z`, `X.Y`) — antes so saia o raw `vX.Y.Z`, e o
      # docs/releasing.md registrava a falta das derivadas semver como
      # limitacao. O input entra por `env:`, nunca interpolado em `run:`.
      - name: Derive semver tags from the dispatch input
        id: ver
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          semver=""; majmin=""
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            semver="${TAG#v}"
            majmin="${semver%.*}"
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "majmin=$majmin" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.ver.outputs.semver }},enable=${{ steps.ver.outputs.semver != '' }}
            type=raw,value=${{ steps.ver.outputs.majmin }},enable=${{ steps.ver.outputs.majmin != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.latest == true }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
