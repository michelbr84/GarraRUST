name: Mobile

# Garra Mobile (apps/garraia-mobile). Two jobs:
#   flutter — analyze + test, the PR gate for the app.
#   apk     — proves `flutter build apk --release` works and publishes the APK
#             as a run artifact. The release.yml job `build-android-apk` is
#             the same recipe attached to a tag.
# The Android SDK cannot be reached from some agent sandboxes (dl.google.com
# is policy-blocked there), so the APK is built here on GitHub-hosted runners,
# which ship the SDK preinstalled.

on:
  push:
    branches: [main]
    paths:
      - "apps/garraia-mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/garraia-mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned: the pubspec.lock is resolved against this SDK. Bump together with
  # the lockfile (see apps/garraia-mobile/SETUP.md).
  FLUTTER_VERSION: "3.47.2"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/garraia-mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        # Every *.g.dart is gitignored (root .gitignore); nothing compiles
        # without this step.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: flutter
    defaults:
      run:
        working-directory: apps/garraia-mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies (lockfile enforced)
        run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write release keystore from secrets (when configured)
        # Secrets are created by the repository owner, never by an agent.
        # Without them the Gradle script falls back to the debug keystore and
        # the resulting APK cannot upgrade an install signed by another key.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::warning ::ANDROID_KEYSTORE_* secrets not set; APK will be signed with the runner's debug keystore (installable, but not upgradeable over a differently-signed install)."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "release keystore configured"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/garraia-mobile-android.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: garraia-mobile-android
          path: apps/garraia-mobile/out/garraia-mobile-android.apk
          if-no-files-found: error
