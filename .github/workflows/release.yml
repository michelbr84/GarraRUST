name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.12)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Workflow-level default: read-only GITHUB_TOKEN. The `release` job overrides
# this with `contents: write` to upload artifacts via softprops/action-gh-release.
# Closes CodeQL rule `actions/missing-workflow-permissions` (Medium).
permissions:
  contents: read

jobs:
  # Build for Linux x86_64
  build-linux-x86_64:
    name: Build Linux x86_64
    # Pinado em 22.04, NÃO ubuntu-latest: o binário linka a glibc do runner, e
    # ubuntu-latest (24.04, glibc 2.39) gerou o erro "version `GLIBC_2.39' not
    # found" das v0.3.2 e v0.3.3 em qualquer sistema mais antigo. Baseline
    # suportada: glibc >= 2.35 (Ubuntu 22.04+, Debian 12+) — manter em
    # sincronia com o preflight MIN_GLIBC do install.sh e docs/installation.md.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --package garraia

      - name: Package binary
        run: |
          mkdir -p release
          cp target/release/garra release/garraia-linux-x86_64
          chmod +x release/garraia-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-linux-x86_64
          path: release/garraia-linux-x86_64

  # Build for Linux ARM64
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        # Da git, NÃO de crates.io: o cross 0.2.5 (último release publicado)
        # usa imagens base Ubuntu 16.04, velhas demais para o toolchain atual.
        # As imagens da git são modernas (>= 20.04).
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build with cross
        # OpenSSL é vendored/estático desde a v0.3.4 (native-tls/vendored via
        # garraia-channels) — nada de libssl-dev no target; o pre-build do
        # Cross.toml agora só garante o perl+make que o openssl-src exige
        # (ver Cross.toml).
        run: cross build --release --target aarch64-unknown-linux-gnu --package garraia

      - name: Package binary
        run: |
          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/garra release/garraia-linux-aarch64
          chmod +x release/garraia-linux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-linux-aarch64
          path: release/garraia-linux-aarch64

  # Build for Windows x86_64
  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --package garraia

      - name: Package binary
        shell: bash
        run: |
          mkdir -p release
          cp target/release/garra.exe release/garraia-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-windows-x86_64
          path: release/garraia-windows-x86_64.exe

  # Build for macOS x86_64
  build-macos-x86_64:
    name: Build macOS x86_64
    # macos-13 was retired by GitHub — jobs targeting it queue forever and
    # never get a runner, which silently blocks the release job's gate (the
    # v0.3.0 run sat queued for 10+ hours). macos-15-intel is the supported
    # Intel image.
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --package garraia

      - name: Package binary
        run: |
          mkdir -p release
          cp target/release/garra release/garraia-macos-x86_64
          chmod +x release/garraia-macos-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-macos-x86_64
          path: release/garraia-macos-x86_64

  # Build for macOS ARM64 (Apple Silicon)
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --package garraia

      - name: Package binary
        run: |
          mkdir -p release
          cp target/release/garra release/garraia-macos-aarch64
          chmod +x release/garraia-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-macos-aarch64
          path: release/garraia-macos-aarch64

  # Build for Windows ARM64 (native, cross-compiled on the x86_64 runner).
  #
  # Best-effort by design: in the `release` job's `needs:` but deliberately
  # NOT in its `if:` condition — the same treatment as build-linux-arm64
  # (sem `continue-on-error`, que o projeto proíbe). Antes da v0.3.4 usuários
  # de Windows ARM64 rodavam o binário x86_64 sob emulação; este job entrega
  # o nativo, e uma falha aqui volta a release ao estado anterior (sem o
  # asset), nunca a bloqueia.
  #
  # Maior risco conhecido: wasmtime é Tier 3 upstream em aarch64-pc-windows-msvc,
  # então este é o build com mais chance de quebrar num bump de deps. O gating
  # acima absorve a falha; se ela persistir, o asset simplesmente não sai.
  build-windows-aarch64:
    name: Build Windows ARM64
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build release
        run: cargo build --release --target aarch64-pc-windows-msvc --package garraia

      - name: Package binary
        shell: bash
        run: |
          mkdir -p release
          cp target/aarch64-pc-windows-msvc/release/garra.exe release/garraia-windows-aarch64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-windows-aarch64
          path: release/garraia-windows-aarch64.exe

  # Build the Windows desktop installers (MSI + NSIS).
  #
  # Best-effort by design: this job is in the `release` job's `needs:` so the
  # release waits for it, but it is deliberately NOT in that job's `if:`
  # condition. That is exactly how build-linux-arm64 is already treated, and it
  # gets best-effort semantics without `continue-on-error`, which the project
  # forbids outright (CLAUDE.md, Regras absolutas).
  #
  # Why it is treated as unproven: `garraia-desktop` is excluded from every
  # cargo invocation in ci.yml because its build needs GTK and a sidecar that
  # Linux runners lack. That reasoning is Linux-specific -- windows-latest ships
  # WebView2, the Tauri CLI fetches WiX and NSIS itself, and step 1 of
  # build-installer.ps1 produces the sidecar -- but this crate has never been
  # built in CI, so a failure here must never block the CLI release.
  #
  # Known failure mode: WiX ProductVersion is a three-part numeric field and
  # cannot express a semver prerelease, so an `-rc` tag fails this job. The
  # gating above absorbs it. See docs/releasing.md.
  build-windows-installer:
    name: Build Windows Installer (MSI + NSIS)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build MSI + NSIS
        shell: pwsh
        # Single source of truth: the same script a maintainer runs locally.
        # It throws when the bundler produces no MSI, so a green-but-empty run
        # is not possible.
        run: ./scripts/build-installer.ps1 -StageDir "${env:RUNNER_TEMP}\bundles"

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # build-installer.ps1 throws when no MSI is produced, so the previous
          # step has already failed if this directory is empty. Asserting anyway
          # keeps the failure message about the missing bundle rather than about
          # an unmatched glob.
          shopt -s nullglob
          bundles=("${RUNNER_TEMP}"/bundles/*)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error ::no bundles produced under ${RUNNER_TEMP}/bundles"
            exit 1
          fi
          cp "${bundles[@]}" release/
          ls -l release/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: garraia-desktop-windows
          path: release/

  # Package the Linux binaries into .deb / .rpm / AppImage.
  #
  # Best-effort by design: in the `release` job's `needs:` but deliberately
  # NOT in its `if:` — the same treatment as build-linux-arm64 and
  # build-windows-installer (sem `continue-on-error`, que o projeto proíbe).
  #
  # Job SEPARADO de propósito: rodar nfpm/appimagetool dentro do job `release`
  # faria qualquer falha do tooling novo bloquear a release inteira — o oposto
  # de best-effort. Aqui só se EMPACOTA binários já buildados pelos jobs acima;
  # nada é recompilado. Ferramentas pinadas por versão + SHA-256 para que um
  # "latest"/"continuous" móvel nunca quebre uma release futura.
  # Decisão de toolchain e naming: docs/adr/0015-linux-packaging-toolchain.md.
  package-linux:
    name: Package Linux (.deb/.rpm/AppImage)
    needs:
      - build-linux-x86_64
      - build-linux-arm64
    # x86_64 é obrigatório (é o que o job empacota incondicionalmente);
    # aarch64 é best-effort — sem o binário, os pacotes arm64 só não saem.
    if: always() && needs.build-linux-x86_64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
      APPIMAGETOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        # Sem `name:` de propósito — baixa o que existir e não falha quando o
        # artifact aarch64 (best-effort) não foi produzido.
        with:
          path: artifacts

      - name: Get version
        id: version
        # Os valores vão por `env:` e são lidos como variáveis de shell entre
        # aspas — nunca interpolados em `run:`. `inputs.version` é texto livre
        # de quem dispara o workflow, e interpolado ele vira injeção de shell.
        # Mesmo padrão do job `release` abaixo.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"

      - name: Install nfpm (pinned + checksum)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 5 --retry-delay 2 -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          mkdir -p nfpm-dist
          tar -xzf nfpm.tar.gz -C nfpm-dist nfpm
          ./nfpm-dist/nfpm --version

      - name: Package .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          mkdir -p stage
          export GARRAIA_PKG_VERSION="${VERSION#v}"

          # pack_arch <goarch> <asset-arch>
          # GOARCH é o que o nfpm espera em `arch:`; o sufixo do asset segue a
          # nomenclatura Rust dos binários crus (x86_64/aarch64). Nomes de
          # saída sem versão — URLs /releases/latest/download/ estáveis.
          pack_arch() {
            goarch="$1"; asset_arch="$2"
            bin="artifacts/garraia-linux-${asset_arch}/garraia-linux-${asset_arch}"
            if [ ! -f "$bin" ]; then
              echo "::warning ::garraia-linux-${asset_arch} not built; skipping its .deb/.rpm."
              return 0
            fi
            export GARRAIA_PKG_ARCH="$goarch"
            export GARRAIA_PKG_BIN="$bin"
            "${RUNNER_TEMP}/nfpm-dist/nfpm" package -f packaging/nfpm.yaml \
              -p deb -t "stage/garraia-linux-${asset_arch}.deb"
            "${RUNNER_TEMP}/nfpm-dist/nfpm" package -f packaging/nfpm.yaml \
              -p rpm -t "stage/garraia-linux-${asset_arch}.rpm"
          }

          pack_arch amd64 x86_64
          pack_arch arm64 aarch64
          ls -l stage/

      - name: Install appimagetool (pinned + checksum)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 5 --retry-delay 2 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

      - name: Build AppImage (x86_64)
        run: |
          set -euo pipefail
          appdir="${RUNNER_TEMP}/garraia.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin"
          cp artifacts/garraia-linux-x86_64/garraia-linux-x86_64 "$appdir/usr/bin/garraia"
          chmod +x "$appdir/usr/bin/garraia"
          cp packaging/appimage/garraia.desktop "$appdir/garraia.desktop"
          # Ícone reaproveitado do desktop Tauri (256x256) — não duplicado no repo.
          cp crates/garraia-desktop/src-tauri/icons/128x128@2x.png "$appdir/garraia.png"
          ln -s usr/bin/garraia "$appdir/AppRun"
          # APPIMAGE_EXTRACT_AND_RUN: os runners ubuntu-latest (24.04) não têm
          # libfuse2, então o próprio appimagetool precisa rodar extraído.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 "${RUNNER_TEMP}/appimagetool" \
            "$appdir" stage/garraia-linux-x86_64.AppImage
          ls -l stage/

      - name: Smoke-test packages
        run: |
          set -euo pipefail
          echo "--- deb ---"
          dpkg-deb --info stage/garraia-linux-x86_64.deb
          dpkg-deb --contents stage/garraia-linux-x86_64.deb | grep -F './usr/bin/garraia'
          echo "--- rpm ---"
          sudo apt-get update -q && sudo apt-get install -y -q rpm
          rpm -qip stage/garraia-linux-x86_64.rpm
          echo "--- AppImage ---"
          # De quebra prova que o binário buildado em 22.04 roda em 24.04.
          chmod +x stage/garraia-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 stage/garraia-linux-x86_64.AppImage --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # Só arquivos flat: o loop de checksums do job `release` roda
        # `sha256sum` sobre `release/*` e um diretório o faria falhar.
        with:
          name: garraia-linux-packages
          path: stage/

  # Create release
  release:
    name: Create Release
    # Wait for every build to settle, but only require x86_64 platforms to have
    # succeeded — ARM64 builds are best-effort while the openssl cross-compile
    # story is being sorted out. Without this guard a single ARM64 failure would
    # skip the release job entirely (which is what blocked v0.1.0-beta.1 and
    # v0.1.0-beta from ever shipping a Linux binary).
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
      - build-windows-aarch64
      - build-macos-x86_64
      - build-macos-arm64
      - build-windows-installer
      - package-linux
    if: |
      always() &&
      needs.build-linux-x86_64.result == 'success' &&
      needs.build-windows-x86_64.result == 'success' &&
      needs.build-macos-x86_64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare binaries
        run: |
          set -euo pipefail
          mkdir -p release

          # Required (x86_64) — release job's `if:` already gated on these.
          cp artifacts/garraia-linux-x86_64/garraia-linux-x86_64 release/
          cp artifacts/garraia-windows-x86_64/garraia-windows-x86_64.exe release/
          cp artifacts/garraia-macos-x86_64/garraia-macos-x86_64 release/

          # Optional (aarch64) — included only if their build job succeeded and
          # uploaded an artifact. softprops/action-gh-release defaults
          # fail_on_unmatched_files to false, so missing entries in the `files:`
          # list below are silently skipped.
          if [ -f artifacts/garraia-linux-aarch64/garraia-linux-aarch64 ]; then
            cp artifacts/garraia-linux-aarch64/garraia-linux-aarch64 release/
          else
            echo "::warning ::Linux aarch64 binary not built; release will ship without it."
          fi
          if [ -f artifacts/garraia-macos-aarch64/garraia-macos-aarch64 ]; then
            cp artifacts/garraia-macos-aarch64/garraia-macos-aarch64 release/
          else
            echo "::warning ::macOS aarch64 binary not built; release will ship without it."
          fi
          if [ -f artifacts/garraia-windows-aarch64/garraia-windows-aarch64.exe ]; then
            cp artifacts/garraia-windows-aarch64/garraia-windows-aarch64.exe release/
          else
            echo "::warning ::Windows aarch64 binary not built; release will ship without it."
          fi

          # The Windows desktop installers, when the best-effort job produced
          # them. Same conditional treatment as the aarch64 binaries above.
          if [ -f artifacts/garraia-desktop-windows/garraia-desktop-windows-x86_64.msi ]; then
            cp artifacts/garraia-desktop-windows/garraia-desktop-windows-x86_64.msi release/
          else
            echo "::warning ::Windows desktop MSI not built; release ships CLI assets only."
          fi
          if [ -f artifacts/garraia-desktop-windows/garraia-desktop-windows-x86_64-setup.exe ]; then
            cp artifacts/garraia-desktop-windows/garraia-desktop-windows-x86_64-setup.exe release/
          fi

          # Linux packages (.deb/.rpm/AppImage) do job best-effort package-linux.
          # x86_64 avisa quando falta (o job deveria tê-los produzido); os
          # pacotes aarch64 pulam em silêncio — a ausência do binário aarch64
          # já emitiu o ::warning:: acima, mesmo tratamento do -setup.exe.
          for pkg in garraia-linux-x86_64.deb garraia-linux-x86_64.rpm garraia-linux-x86_64.AppImage; do
            if [ -f "artifacts/garraia-linux-packages/${pkg}" ]; then
              cp "artifacts/garraia-linux-packages/${pkg}" release/
            else
              echo "::warning ::${pkg} not packaged; release will ship without it."
            fi
          done
          for pkg in garraia-linux-aarch64.deb garraia-linux-aarch64.rpm; do
            if [ -f "artifacts/garraia-linux-packages/${pkg}" ]; then
              cp "artifacts/garraia-linux-packages/${pkg}" release/
            fi
          done

          # Ship the installer as a release asset too. Release-asset downloads
          # go through GitHub's release CDN, which does not enforce the
          # aggressive per-IP limits that make raw.githubusercontent.com
          # answer 429 on shared cloud-pod egress IPs:
          #   curl -fsSL https://github.com/michelbr84/GarraRUST/releases/latest/download/install.sh | sh
          cp install.sh release/

          # Same reasoning for the Windows installer: `irm | iex` against the
          # release CDN is the mirror that keeps working when
          # raw.githubusercontent.com answers 429.
          cp install.ps1 release/

      - name: Package archives
        # Additive on purpose. `garra update` resolves assets by exact name
        # (crates/garraia-cli/src/update.rs:42-48) and needs a `<asset>.sha256`
        # sibling (:127), so the bare binaries stay exactly as they are and the
        # archives sit beside them. Replacing them would break the auto-updater
        # of every install already in the field.
        #
        # Staged under RUNNER_TEMP, never inside release/: the checksum loop
        # below is `for f in *` under `set -euo pipefail`, and sha256sum on a
        # directory exits non-zero, which would fail the whole release job.
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { echo "::error ::zip is not installed on this runner"; exit 1; }

          stage="${RUNNER_TEMP}/archive-stage"
          rm -rf "$stage"
          mkdir -p "$stage"

          # pack <source-asset> <archive-basename> <name-inside-archive> <format>
          #
          # The archive basename is passed separately from the source asset so
          # the Windows archive is `garraia-windows-x86_64.zip`, not
          # `garraia-windows-x86_64.exe.zip`.
          pack() {
            asset="$1"; base="$2"; inner="$3"; format="$4"
            if [ ! -f "release/${asset}" ]; then
              echo "::warning ::${asset} not present; skipping its archive."
              return 0
            fi

            dir="$stage/${base}"
            mkdir -p "$dir"
            # Renamed to the plain command name so extracting the archive
            # yields a usable `garraia`, not a platform-suffixed file. The
            # single top-level directory also keeps this from being a tarbomb.
            cp "release/${asset}" "$dir/${inner}"
            chmod +x "$dir/${inner}"
            # MIT requires the notice to travel with redistributions, and an
            # archive is a redistribution. README gives an offline quick start.
            cp LICENSE README.md "$dir/"

            case "$format" in
              tar)
                # Deterministic ordering and ownership so the archive bytes
                # depend only on the contents.
                tar --sort=name --owner=0 --group=0 --numeric-owner \
                    -czf "${GITHUB_WORKSPACE}/release/${base}.tar.gz" \
                    -C "$stage" "${base}"
                ;;
              zip)
                ( cd "$stage" && zip -qr "${GITHUB_WORKSPACE}/release/${base}.zip" "${base}" )
                ;;
            esac
            echo "packaged ${base} (${format})"
          }

          pack garraia-linux-x86_64       garraia-linux-x86_64   garraia     tar
          pack garraia-linux-aarch64      garraia-linux-aarch64  garraia     tar
          pack garraia-macos-x86_64       garraia-macos-x86_64   garraia     tar
          pack garraia-macos-aarch64      garraia-macos-aarch64  garraia     tar
          pack garraia-windows-x86_64.exe garraia-windows-x86_64 garraia.exe zip
          pack garraia-windows-aarch64.exe garraia-windows-aarch64 garraia.exe zip

          rm -rf "$stage"
          echo "--- release/ ---"
          ls -l release/

      - name: Get version
        id: version
        # Os valores vão por `env:` e são lidos como variáveis de shell entre
        # aspas — nunca interpolados em `run:`. `inputs.version` é texto livre
        # de quem dispara o workflow, e interpolado ele vira injeção de shell.
        # Mesmo padrão de branch-cleanup.yml:56-60.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION: $VERSION"

      - name: Generate checksums
        # Produces BOTH the aggregate SHA256SUMS (for human verification +
        # install.sh single-fetch) AND per-asset `<name>.sha256` files
        # consumed by `garraia update` (see crates/garraia-cli/src/update.rs:127
        # — it expects `<asset>.sha256` siblings). Without per-asset files the
        # auto-updater aborts with "release is missing checksum file".
        run: |
          set -euo pipefail
          cd release
          : > SHA256SUMS
          for f in *; do
            # Skip the SHA256SUMS file itself and any pre-existing .sha256 files
            # so a re-run never recursively hashes its own output.
            case "$f" in
              SHA256SUMS|*.sha256) continue ;;
            esac
            sha256sum "$f" | tee -a SHA256SUMS > "${f}.sha256"
          done
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          echo "--- per-asset .sha256 files ---"
          ls -1 *.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Sem tag_name explícito, o softprops usa github.ref — que num
          # workflow_dispatch a partir de main seria "main", criando release
          # com tag errada. Com tag_name, o dispatch com input `version`
          # cria o tag vX.Y.Z no commit do run e a release correta.
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
          # `softprops/action-gh-release` uses glob expansion on this list, so
          # `*.sha256` covers every per-asset checksum (one per staged asset;
          # missing best-effort builds simply contribute fewer matches).
          # `fail_on_unmatched_files` defaults to false, so a missing optional
          # binary still ships the release with what we have.
          files: |
            release/garraia-linux-x86_64
            release/garraia-linux-aarch64
            release/garraia-windows-x86_64.exe
            release/garraia-windows-aarch64.exe
            release/garraia-macos-x86_64
            release/garraia-macos-aarch64
            release/garraia-linux-x86_64.tar.gz
            release/garraia-linux-aarch64.tar.gz
            release/garraia-macos-x86_64.tar.gz
            release/garraia-macos-aarch64.tar.gz
            release/garraia-windows-x86_64.zip
            release/garraia-windows-aarch64.zip
            release/garraia-linux-x86_64.deb
            release/garraia-linux-aarch64.deb
            release/garraia-linux-x86_64.rpm
            release/garraia-linux-aarch64.rpm
            release/garraia-linux-x86_64.AppImage
            release/garraia-desktop-windows-x86_64.msi
            release/garraia-desktop-windows-x86_64-setup.exe
            release/install.sh
            release/install.ps1
            release/SHA256SUMS
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
