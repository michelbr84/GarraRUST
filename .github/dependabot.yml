# Dependabot configuration — see GAR-590.
# Tracks: cargo workspace (root), npm test deps (tests/), GitHub Actions, and
# the root Dockerfile.
# Out of scope: pub (Flutter, no Dependabot support), pip (services/voice, deferred).
# docker + docker-compose em /deploy/docker foram REMOVIDOS em 2026-09-02:
# o diretório nunca existiu neste repo (layout do repo privado) e as duas
# entradas falhavam todo run com dependency_file_not_found (runs #282/#283).
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # wasmtime e wasmtime-wasi precisam da MESMA versão major para
      # compilar (o par bumpado separado quebrou os PRs #833/#838 em
      # 2026-08-18). Grupo declarado ANTES de patch-and-minor porque a
      # dep entra no primeiro grupo que casar — este casa por pattern
      # em qualquer update-type, inclusive majors.
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-wasi"
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # dtolnay/rust-toolchain@1.95 no ci.yml é o pin de MSRV do workspace,
    # não uma versão de action — o Dependabot tentava "bumpar" para um
    # toolchain Rust inexistente (@1.100, PR #819) e quebrava o job
    # "MSRV check (1.95)". Bump de MSRV é decisão manual (ci.yml + Cargo.toml
    # rust-version + Dockerfile juntos).
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      gh-actions-all:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
