    # selectors → tauri-utils → garraia-desktop. Zero server runtime risk.
    # No patch exists for the 0.7.x line; fix requires phf_codegen to
    # upgrade its rand dep. Tracked by: GAR-513. Expires: 2026-07-31.
    "RUSTSEC-2026-0097",

    # NOTE: RUSTSEC-2026-0037 (quinn-proto DoS in Quinn endpoints) was
    # closed by GAR-457 (2026-04-27, PR-following-#75). Resolution:
    # `cargo update -p quinn-proto --precise 0.11.14` lockfile-only patch.
    # Ignore removed.
    #
    # NOTE: RUSTSEC-2025-0111 (tokio-tar PAX file smuggling) was closed
    # by plan 0053 PR-3 (GAR-449). Resolution: testcontainers 0.23 →
    # 0.27.3 + testcontainers-modules 0.11 → 0.15.0 replaces tokio-tar
    # with astral-tokio-tar 0.6.0. Ignore removed.
    #
    # NOTE: RUSTSEC-2026-0105 (core2 0.4.0 unmaintained + yanked) was
    # closed by plan 0053 PR-5 (GAR-451). Resolution: AVIF feature-gated
    # OFF in `crates/garraia-media/Cargo.toml`. Ignore removed.
    #
]
