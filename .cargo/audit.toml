    "RUSTSEC-2024-0429",

    # NOTE: RUSTSEC-2026-0002 (lru 0.12.5 IterMut stacked-borrows violation)
    # closed by GAR-593 (2026-05-12, health routine PR health/202605121530).
    # Resolution: aws-sdk-s3 1.119→1.132 (PR #297) pulled lru 0.16.4 which
