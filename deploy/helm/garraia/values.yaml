# Default values for garraia Helm chart

replicaCount: 1

image:
  repository: ghcr.io/michelbr84/garraia
  tag: ""  # Defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3888
  targetPort: 3888

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: garraia.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: garraia-tls
  #    hosts:
  #      - garraia.example.com

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: ""
  credentials:
    enabled: true
    accessMode: ReadWriteOnce
    size: 100Mi
    storageClass: ""

env:
  GARRAIA_LOG_LEVEL: info

# Sensitive values — reference a Kubernetes Secret
secretEnv:
  # GARRAIA_VAULT_PASSPHRASE: ""
  # GARRAIA_JWT_SECRET: ""
  # ANTHROPIC_API_KEY: ""
  # Do NOT put GARRAIA_GATEWAY_API_KEY here: use `gatewayApiKey` below.

# Gateway credential (GARRAIA_GATEWAY_API_KEY) — REQUIRED since v0.4.5 (#1261).
#
# The image runs `garraia start --host 0.0.0.0`, and `garraia start` refuses a
# non-loopback bind without a gateway credential (exit 78, CrashLoopBackOff).
# The key gates every /api/* route and the /ws agent channel; clients send it
# as `Authorization: Bearer <key>`.
#
# Pick one source, in this order of precedence:
#   1. existingSecret: a Secret you manage (recommended for GitOps/production);
#   2. value: the key itself (e.g. --set gatewayApiKey.value=$(openssl rand -hex 32));
#   3. neither: the chart GENERATES a random key on install, stores it in the
#      Secret "<fullname>-gateway-key" and keeps it on upgrade (lookup).
#      `helm template` / ArgoCD cannot lookup, so there the key would change
#      on every render: set existingSecret or value in those setups.
# Read the generated key with:
#   kubectl get secret <fullname>-gateway-key \
#     -o jsonpath='{.data.GARRAIA_GATEWAY_API_KEY}' | base64 -d
gatewayApiKey:
  existingSecret: ""
  existingSecretKey: GARRAIA_GATEWAY_API_KEY
  value: ""

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
