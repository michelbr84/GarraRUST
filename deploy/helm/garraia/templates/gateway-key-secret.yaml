{{- /*
#1261: the image binds 0.0.0.0, and `garraia start` refuses that bind without
a gateway credential. This Secret carries GARRAIA_GATEWAY_API_KEY unless the
operator points gatewayApiKey.existingSecret at one they manage.

Value precedence: gatewayApiKey.value > the key already stored in this Secret
(lookup, so an upgrade never rotates it) > a new random key. The Secret is
kept on `helm uninstall` so a reinstall does not invalidate every client.
*/ -}}
{{- if not .Values.gatewayApiKey.existingSecret }}
{{- $name := include "garraia.gatewayKeySecretName" . }}
{{- $key := "" }}
{{- if .Values.gatewayApiKey.value }}
{{- $key = .Values.gatewayApiKey.value | trim }}
{{- if not $key }}
{{- fail "gatewayApiKey.value is blank: a blank key leaves the gateway without a credential and garraia refuses to boot (#1261)" }}
{{- end }}
{{- else }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (index $existing.data "GARRAIA_GATEWAY_API_KEY") }}
{{- $key = index $existing.data "GARRAIA_GATEWAY_API_KEY" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "garraia.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  GARRAIA_GATEWAY_API_KEY: {{ $key | b64enc | quote }}
{{- end }}
